<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#3a45d6"><style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Hangul Midterm Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: one column app, sticky lesson bar on top, thumb-reach tab bar at the bottom. Cover-yellow (sun) marks emphasis, indigo drives actions. */
:root {
  --bg:#eef0f6; --surface:#ffffff; --fg:#1b1f3b; --muted:#5a6083; --line:#d3d8e8;
  --accent:#3a45d6; --accent-fg:#ffffff; --sun:#ffcf33; --sun-fg:#3b2e00;
  --good:#1b7f47; --bad:#c3372d; --ink:#1b1f3b; --grid:#c4cae2; --soft:#e4e7f4;
  --display:'Noto Serif KR','Batang',serif; --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f1226; --surface:#181c38; --fg:#eceefb; --muted:#9ba2c9; --line:#2a2f5e;
  --accent:#929bff; --accent-fg:#0f1226; --good:#52d38a; --bad:#ff7d73; --ink:#f4f5ff; --grid:#33396e; --soft:#222750; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0f1226; --surface:#181c38; --fg:#eceefb; --muted:#9ba2c9; --line:#2a2f5e;
  --accent:#929bff; --accent-fg:#0f1226; --good:#52d38a; --bad:#ff7d73; --ink:#f4f5ff; --grid:#33396e; --soft:#222750; color-scheme:dark; }

*{box-sizing:border-box}
body{touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin-inline:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{min-width:0}
.brand b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.2}
.brand span{font-size:.8rem;color:var(--muted)}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.88rem;font-weight:500;white-space:nowrap}
.pill[aria-expanded="true"]{border-color:var(--accent)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 18px;font-weight:500;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.good{border-color:var(--good);color:var(--good);font-weight:700}
.btn.bad{border-color:var(--bad);color:var(--bad);font-weight:700}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-fg);font-weight:700}
.btn.sm{padding:8px 12px;min-height:40px;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 0;min-width:0}

#panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;display:grid;gap:16px}
#panel h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;min-width:48px;min-height:44px;padding:6px 12px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.field{display:flex;flex-wrap:wrap;gap:8px}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;min-width:0;flex:1 1 140px}
.cust{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}

.view{padding-block:18px}
.view[hidden]{display:none!important}
.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.tag{display:inline-block;background:var(--sun);color:var(--sun-fg);font-weight:700;font-size:.75rem;border-radius:6px;padding:2px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 20px;min-height:260px;display:grid;place-items:center;text-align:center;gap:10px;cursor:pointer;user-select:none;margin-block:14px}
.card .ko{font-family:var(--display);font-weight:700;font-size:clamp(2rem,9vw,3.6rem);line-height:1.25;overflow-wrap:anywhere}
.card .ko.s{font-size:clamp(1.5rem,6vw,2.3rem)}
.card .en{font-size:clamp(1.2rem,4.5vw,1.7rem);font-weight:500;overflow-wrap:anywhere}
.card .hint{font-size:.8rem;color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:12px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;min-height:64px;text-align:left;font-weight:500;overflow-wrap:anywhere}
.opt.ko{font-family:var(--display);font-weight:700;font-size:1.25rem}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.q{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center}
.q .ko{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,8vw,3rem);overflow-wrap:anywhere}
.q .en{font-size:clamp(1.2rem,5vw,1.6rem);font-weight:500;overflow-wrap:anywhere}
.big{font-family:var(--display);font-size:3rem;font-weight:700}

.pad{position:relative;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);height:clamp(300px,48vh,520px);margin-block:12px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:80px 80px;background-position:-1px -1px}
.pad::before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,transparent calc(50% - .5px),var(--grid) calc(50% - .5px),var(--grid) calc(50% + .5px),transparent calc(50% + .5px));background-size:80px 80px;opacity:.55;pointer-events:none}
#ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--fg);opacity:.14;pointer-events:none;text-align:center;line-height:1.15;padding:8px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface) inset}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:10px 14px;min-height:44px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:center}
.ans .ko{font-family:var(--display);font-weight:700;font-size:1.9rem;overflow-wrap:anywhere}
.ans .en{color:var(--muted)}

details.g{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.g summary{padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700;list-style:none}
details.g summary::-webkit-details-marker{display:none}
details.g .body{padding:0 16px 14px;display:grid;gap:8px}
.form{font-family:var(--display);font-weight:700;background:var(--soft);border-radius:8px;padding:6px 10px;display:inline-block;overflow-wrap:anywhere}
.ex{display:grid;gap:0;border-top:1px solid var(--line);padding-top:6px}
.ex b{font-family:var(--display)}
.ex span{color:var(--muted);font-size:.9rem}
h2.sec{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.hg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:64px;font-family:var(--display);font-weight:700;font-size:1.6rem}
.hg button small{display:block;font-family:var(--body);font-weight:400;font-size:.68rem;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{display:flex;gap:4px;width:100%;max-width:880px}
.tabs button{flex:1 1 0;min-width:0;border:0;background:none;border-radius:12px;padding:8px 2px;min-height:56px;color:var(--muted);font-size:.74rem;font-weight:500;display:grid;justify-items:center;gap:2px}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--soft);font-weight:700}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
.fs{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,6.5vw,2.4rem);line-height:1.6;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);margin-inline:2px;line-height:1.1}
.fillin{display:inline-block;padding:0 6px;border-radius:8px;margin-inline:1px}
.fillin.right{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.fillin.wrong{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad);text-decoration:line-through}
.why{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:.95rem}
.opt.ko.p{text-align:center;font-size:1.5rem}
.cheat{width:100%;border-collapse:collapse;font-size:.92rem}
.cheat th,.cheat td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.cheat td:first-child{font-family:var(--display);font-weight:700;white-space:nowrap}
.cheatw{overflow-x:auto}
.tk{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:48px;font-family:var(--display);font-weight:700;font-size:1.2rem}
.ordbox{min-height:72px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1.5px dashed var(--line);border-radius:14px;margin-top:12px;background:var(--surface)}
.ordbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tk:disabled{opacity:1}
.ctx{text-align:left;background:var(--soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-family:var(--display);font-weight:600;line-height:1.7;overflow-wrap:anywhere}
.legend{font-size:.8rem;color:var(--muted);line-height:1.6;margin-top:8px}
select.sel{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px}
.row>.btn.grow{flex:1 1 130px;white-space:nowrap}
#toast{pointer-events:none;position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 16px;max-width:560px;margin-inline:auto;font-size:.92rem;box-shadow:0 4px 18px rgba(0,0,0,.25)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>서울대 한국어 1A</b><span>Midterm drill · Lessons 1 to 8</span></div>
    <button class="pill" id="lessonsBtn" aria-expanded="false" aria-controls="panel"></button>
  </header>

  <section id="panel" hidden>
    <div><h3>Lessons in the test</h3><div class="chips" id="chips"></div><div class="legend" id="legend"></div></div>
    <div><h3>Cards to practise</h3>
      <div class="seg" id="filterSeg"><button data-f="all">All</button><button data-f="weak">Weak ones</button><button data-f="w">Words</button><button data-f="s">Sentences</button></div></div>
    <div><h3>Add your own card</h3>
      <form class="field" id="addForm"><input id="addKo" placeholder="Korean" lang="ko" autocomplete="off"><input id="addEn" placeholder="English" autocomplete="off">
        <select id="addL" aria-label="Lesson"></select><select id="addT" aria-label="Type"><option value="w">Word</option><option value="s">Sentence</option></select>
        <button class="btn primary" type="submit">Add</button></form>
      <div id="custList"></div></div>
    <div><h3>Sound</h3><div class="row"><span id="soundTxt" class="grow"></span><button class="btn sm sun" id="testSnd">Test sound</button></div></div>
    <div><h3>Hidden cards</h3><div class="row"><span id="hidTxt" class="grow"></span><button class="btn sm" id="restoreBtn">Restore all</button></div></div>
    <div><h3>Progress</h3><div class="row"><span id="progTxt" class="grow"></span><button class="btn sm bad" id="resetBtn">Reset progress</button></div></div>
  </section>

  <main>
    <section class="view" id="v-cards"></section>
    <section class="view" id="v-quiz" hidden></section>
    <section class="view" id="v-fill" hidden></section>
    <section class="view" id="v-write" hidden>
      <div class="row" style="margin-bottom:10px"><div class="seg" id="wmode"><button data-wm="see">See English</button><button data-wm="hear">Hear Korean</button></div></div>
      <div class="meta"><span id="wTag"></span><span id="wCount"></span></div>
      <div class="ans" id="wPrompt"></div>
      <div class="pad" id="pad"><div id="ghost" hidden></div><canvas id="cv" aria-label="Writing area. Draw with Apple Pencil or finger."></canvas></div>
      <div class="tools">
        <div class="seg" id="toolSeg"><button data-t="pen" aria-pressed="true">Pen</button><button data-t="er" aria-pressed="false">Eraser</button></div>
        <button class="sw" data-c="ink" aria-label="Ink" style="background:var(--ink)"></button>
        <button class="sw" data-c="red" aria-label="Red" style="background:#d93a2f"></button>
        <button class="sw" data-c="blue" aria-label="Blue" style="background:#2563eb"></button>
        <div class="seg" id="inSeg" title="Which input draws"><button data-i="any" aria-pressed="true">Pencil + finger</button><button data-i="pen" aria-pressed="false">Pencil only</button></div>
        <button class="btn sm" id="undoBtn">Undo</button><button class="btn sm" id="clearBtn">Clear</button>
      </div>
      <div class="row" style="margin-top:14px" id="wActions"></div>
    </section>
    <section class="view" id="v-grammar" hidden></section>
    <section class="view" id="v-hangul" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections"><div role="tablist" id="tabs"></div></nav>

  ${show?`<div class="why"><b>${f.pick!==null?(ok?'Correct. ':'Not quite. '):''}</b>${esc(q.w)}</div>
    <div class="row" style="margin-top:12px"><button class="btn sm" id="flisten">${spk} Listen</button><span class="grow"></span>
    ${f.mode==='recall'&&f.pick===null?'<button class="btn bad" data-fr="0">Missed it</button><button class="btn good" data-fr="1">Got it</button>':'<button class="btn primary" id="fnext">Next</button>'}</div>`:''}
  <h2 class="sec">Particle and ending cheat sheet</h2>
  <details class="g"><summary>Open the cheat sheet</summary><div class="body cheatw"><table class="cheat"><tbody>${CHEAT.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}<br><span style="color:var(--muted)">${esc(r[2])}</span></td></tr>`).join('')}</tbody></table></div></details>`;
}
$('#v-fill').onclick=e=>{const f=S.fill,q=f.q;
  const md=e.target.closest('[data-m]');if(md){f.mode=md.dataset.m;sv('kr.fmode',f.mode);f.pick=null;f.shown=false;renderFill();return}
  if(e.target.closest('#freveal')){f.shown=true;renderFill();return}
  if(e.target.closest('#flisten')){say(q.s.replace('___',q.a[0]==='X'?'':q.a[0]));return}
  if(e.target.closest('#fnext')){nextFill();renderFill();return}
  const fr=e.target.closest('[data-fr]');if(fr){mark(q,fr.dataset.fr==='1');renderPanel();nextFill();renderFill();return}
  const o=e.target.closest('[data-o]');if(o&&f.pick===null){f.pick=f.opts[+o.dataset.o];mark(q,q.a.includes(f.pick));renderPanel();
    if(q.a.includes(f.pick))say(q.s.replace('___',q.a[0]==='X'?'':q.a[0]));renderFill()}};

/* ---------- WRITE ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d'),pad=$('#pad');
let strokes=[],cur=null,dpr=1,tool='pen',colorKey='ink',inMode='any',lastPen=0,penLocked=false;
function syncIn(){$$('#inSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.i===inMode))}
function penSeen(){lastPen=Date.now();if(!penLocked){penLocked=true;inMode='pen';syncIn()}
  if(cur&&cur.t!=='pen'){strokes.pop();cur=null;redraw()}} // a palm landed first: drop it
const COL={red:'#d93a2f',blue:'#2563eb'};
const colorOf=k=>COL[k]||getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';
function sizeCanvas(){const r=pad.getBoundingClientRect();if(!r.width)return;dpr=Math.max(1,devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);redraw();fitGhost()}
function seg(s,a,b){const W=cv.width/dpr,H=cv.height/dpr;const pr=b.p;
  ctx.lineWidth=s.er?s.w*5:s.w*(.45+pr*1.1);ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke()}
function drawStroke(s){ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap=ctx.lineJoin='round';
  ctx.globalCompositeOperation=s.er?'destination-out':'source-over';ctx.strokeStyle=s.er?'#000':colorOf(s.c);ctx.fillStyle=ctx.strokeStyle;
  const p=s.p;if(p.length===1){const W=cv.width/dpr,H=cv.height/dpr;ctx.beginPath();ctx.arc(p[0].x*W,p[0].y*H,(s.er?s.w*2.5:s.w*.8),0,7);ctx.fill()}
  for(let i=1;i<p.length;i++)seg(s,p[i-1],p[i]);ctx.restore()}
function redraw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);strokes.forEach(drawStroke)}
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,p:e.pointerType==='pen'&&e.pressure>0?e.pressure:.5}}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='pen')penSeen();
  else if(e.pointerType==='touch'&&(inMode==='pen'||Date.now()-lastPen<800))return; // palm rejection
  e.preventDefault();cv.setPointerCapture(e.pointerId);
  cur={id:e.pointerId,t:e.pointerType,er:tool==='er',c:colorKey,w:3.2,p:[pt(e)]};strokes.push(cur);drawStroke(cur)});
cv.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;e.preventDefault();
  if(e.pointerType==='pen')lastPen=Date.now();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap=ctx.lineJoin='round';
  ctx.globalCompositeOperation=cur.er?'destination-out':'source-over';ctx.strokeStyle=cur.er?'#000':colorOf(cur.c);
  for(const ev of (evs.length?evs:[e])){const n=pt(ev),a=cur.p[cur.p.length-1];cur.p.push(n);seg(cur,a,n)}ctx.restore()});
const end=e=>{if(cur&&e.pointerId===cur.id)cur=null};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function fitGhost(){const g=$('#ghost');if(!S.w.card)return;const t=S.w.card.k.replace(/\s*\(.*?\)/g,'').replace(/\s+/g,' ');const W=pad.clientWidth,H=pad.clientHeight;
  g.textContent=t;g.style.fontSize=Math.max(28,Math.min(H*.6,W*.92/Math.max(2,t.length*.95)))+'px'}
new ResizeObserver(()=>{if(S.tab==='write')sizeCanvas()}).observe(pad);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',redraw);

$('#toolSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;tool=b.dataset.t;$$('#toolSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
$('#inSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;inMode=b.dataset.i;penLocked=true;syncIn()};
$$('.sw').forEach(b=>b.onclick=()=>{colorKey=b.dataset.c;tool='pen';$$('#toolSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t==='pen'));updSw()});
function updSw(){$$('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===colorKey))}updSw();
$('#undoBtn').onclick=()=>{strokes.pop();redraw()};
$('#clearBtn').onclick=()=>{strokes=[];redraw()};

function nextWrite(free){
  const p=pool();strokes=[];redraw();
  S.w.card=free||(p.length?pick(p,S.w.card&&id(S.w.card)):null);S.w.shown=!!(free&&free.free);renderWrite();if(S.w.hear&&S.w.card&&!S.w.card.free)say(S.w.card.k)}
function renderWrite(){
  const c=S.w.card,p=pool();$('#wCount').textContent=c&&c.free?'':`${p.filter(mastered).length} / ${p.length} mastered`;
  if(!c){$('#wTag').innerHTML='';$('#wPrompt').innerHTML='<div class="en">No cards match. Pick a lesson in the lessons panel.</div>';$('#wActions').innerHTML='';$('#ghost').hidden=true;return}
  $('#wTag').innerHTML=c.free?'<span class="tag">Tracing</span>':`<span class="tag">Lesson ${c.l}</span> ${esc(LT[c.l]||'')}`;
  $('#wPrompt').innerHTML=c.free?`<div class="ko">${esc(c.k)}</div><div class="en">${esc(c.e)}</div>`
    :(S.w.hear&&!S.w.shown?`<div class="hint" style="font-size:.8rem;color:var(--muted)">Listen, then write what you hear</div><button class="btn sun" data-w="listen" style="margin-top:8px">${spk} Play again</button>`
     :`<div class="hint" style="font-size:.8rem;color:var(--muted)">${S.w.hear?'You heard':'Write this in Korean'}</div><div style="font-size:1.4rem;font-weight:700;overflow-wrap:anywhere">${esc(c.e)}</div>`)+
     (S.w.shown?`<div class="ko" style="margin-top:6px">${esc(c.k)}</div>`:'');
  $$('#wmode button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.wm==='hear')===S.w.hear));
  $('#ghost').hidden=!(S.w.shown&&S.w.trace);fitGhost();
  $('#wActions').innerHTML=(S.w.shown?
    (c.free?'':`<button class="btn bad grow" data-w="miss">Missed it</button><button class="btn good grow" data-w="ok">Got it</button>`)
    +`<button class="btn sm" data-w="listen">${spk} Listen</button><button class="btn sm" data-w="trace">${S.w.trace?'Hide guide':'Show guide'}</button>`
    :`<button class="btn sun grow" data-w="show">Show answer</button>`)+`<button class="btn sm" data-w="skip">${c.free?'Next card':'Skip'}</button>`}
$('#wmode').onclick=e=>{const b=e.target.closest('[data-wm]');if(!b)return;S.w.hear=b.dataset.wm==='hear';sv('kr.hear',S.w.hear);nextWrite()};
$('#wPrompt').onclick=e=>{if(e.target.closest('[data-w="listen"]'))say(S.w.card.k)};
$('#wActions').onclick=e=>{const b=e.target.closest('[data-w]');if(!b)return;const a=b.dataset.w,c=S.w.card;
  if(a==='show'){S.w.shown=true;S.w.trace=true;renderWrite()}
  else if(a==='trace'){S.w.trace=!S.w.trace;renderWrite()}
  else if(a==='listen')say(c.k);
  else if(a==='ok'||a==='miss'){mark(c,a==='ok');renderPanel();nextWrite()}
  else if(a==='skip')nextWrite()};

/* ---------- GRAMMAR ---------- */
function renderGrammar(){
  const gs=G.filter(g=>S.sel.has(g.l));
  $('#v-grammar').innerHTML=gs.length?gs.map(g=>`<details class="g"><summary><span class="tag">L${g.l}</span>${esc(g.t)}</summary><div class="body"><span class="form">${esc(g.f)}</span><div>${esc(g.n)}</div>
    ${g.x.map(([k,e])=>`<div class="ex"><b>${esc(k)}</b><span>${esc(e)}</span></div>`).join('')}</div></details>`).join('')
    :`<div class="empty">No lessons selected.</div>`}
$('#v-grammar').onclick=null;

/* ---------- HANGUL ---------- */
function renderHangul(){
  const grp=(t,list,mk)=>`<h2 class="sec">${t}</h2><div class="hg">${list.map(c=>{const s=mk(c);return`<button data-h="${c}" data-s="${s}">${c}<small>${s}</small></button>`}).join('')}</div>`;
  $('#v-hangul').innerHTML=`<div class="meta"><span>Tap a letter to hear it, then trace it on the Write tab.</span></div>
  <div class="row" id="hSel" style="margin-bottom:6px"><span class="grow" id="hCur">Pick a letter</span><button class="btn sm sun" id="hTrace" disabled>Trace it</button></div>`+
  grp('Consonants',CONS,c=>syl(c,'ㅏ'))+grp('Double consonants',TENSE,c=>syl(c,'ㅏ'))+grp('Vowels',VOW,v=>syl('ㅇ',v))+grp('Compound vowels',VOW2,v=>syl('ㅇ',v))}
let hSel=null;
$('#v-hangul').onclick=e=>{const b=e.target.closest('[data-h]');
  if(b){hSel=b.dataset.h;say(b.dataset.s);$('#hCur').innerHTML=`<b style="font-family:var(--display);font-size:1.4rem">${hSel}</b> ${b.dataset.s}`;$('#hTrace').disabled=false;return}
  if(e.target.closest('#hTrace')&&hSel){const s=$$('[data-h]').find(x=>x.dataset.h===hSel).dataset.s;go('write');nextWrite({free:true,l:0,k:hSel,e:'Trace this letter ('+s+')',t:'w'})}};

/* ---------- BOOT ---------- */
rebuild();renderPanel();go('cards');
</script>

</body></html>
